<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Link Forge | Create Secure Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Create-page overrides */
      body {
        justify-content: flex-start;
        padding: 32px 0 48px;
      }

      .create-wrap {
        width: 95%;
        max-width: 860px;
        margin: 0 auto;
        background: var(--card-bg);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 28px;
        box-shadow: 0 0 60px rgba(0,0,0,0.6);
        overflow: hidden;
        animation: podEntry 0.8s cubic-bezier(0.16,1,0.3,1) both;
      }

      .create-header {
        text-align: center;
        padding: 52px 40px 36px;
        background: linear-gradient(180deg, rgba(168,85,247,0.07) 0%, transparent 100%);
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .create-header .logo-box {
        margin: 0 auto 22px;
        border-color: var(--secondary);
        box-shadow: 0 0 28px rgba(168,85,247,0.3), inset 0 0 16px rgba(168,85,247,0.08);
        color: var(--secondary);
      }
      .create-header h1 {
        background: linear-gradient(135deg, #fff 30%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
      }

      .create-body {
        padding: 40px 40px 48px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-bottom: 28px;
      }
      @media (min-width: 640px) {
        .form-grid { grid-template-columns: 1fr 1fr; }
        .full-width { grid-column: span 2; }
      }

      .result-box {
        margin-top: 28px;
        padding: 28px;
        background: rgba(0,0,0,0.3);
        border: 2px solid var(--primary);
        border-radius: 20px;
        display: none;
        animation: fadeSlideIn 0.4s ease both;
      }
      .result-label {
        font-size: 12px; font-weight: 800;
        color: var(--primary); letter-spacing: 1px;
        text-transform: uppercase; margin-bottom: 14px;
      }
      .result-url {
        background: rgba(0,0,0,0.5);
        padding: 16px; border-radius: 12px;
        font-size: 12px; word-break: break-all;
        color: #e5e7eb; line-height: 1.6;
        border: 1px solid rgba(255,255,255,0.07);
        margin-bottom: 20px;
        font-family: 'Courier New', monospace;
      }

      .create-footer {
        text-align: center;
        font-size: 12px; color: var(--text-muted);
        padding: 20px 40px 28px;
        border-top: 1px solid rgba(255,255,255,0.05);
      }
      .create-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }
      .create-footer a:hover { text-decoration: underline; }

      @media (max-width: 640px) {
        body { padding: 20px 0 36px; }
        .create-header { padding: 36px 22px 28px; }
        .create-body { padding: 28px 22px 36px; }
        .create-footer { padding: 18px 22px 24px; }
      }
    </style>
  </head>
  <body>
    <div id="particles-js"></div>

    <div class="create-wrap">

      <!-- Header -->
      <header class="create-header">
        <div class="logo-box">
          <i class="fas fa-bolt"></i>
        </div>
        <h1>Forge Your Link</h1>
        <p class="desc-text">Create a high-end, encrypted verification portal in seconds.</p>
      </header>

      <!-- Form body -->
      <div class="create-body">
        <div class="form-grid">

          <div class="form-group">
            <label>Title <span style="color:#ef4444">*</span></label>
            <input type="text" id="title" class="input-field" placeholder="e.g. My Premium File">
          </div>

          <div class="form-group">
            <label>Destination URL <span style="color:#ef4444">*</span></label>
            <input type="url" id="url" class="input-field" placeholder="https://example.com/file.zip">
          </div>

          <div class="form-group">
            <label>Cover Image URL</label>
            <input type="url" id="cover" class="input-field" placeholder="https://example.com/bg.jpg">
          </div>

          <div class="form-group">
            <label>Brand Logo URL</label>
            <input type="url" id="logo" class="input-field" placeholder="https://example.com/logo.png">
          </div>

          <div class="form-group full-width">
            <label>YouTube — Paste embed code, video URL, or video ID</label>
            <input type="text" id="yt" class="input-field" placeholder="Paste &lt;iframe&gt; embed code, https://youtube.com/watch?v=... or video ID">
          </div>

          <div class="form-group full-width">
            <label>Description</label>
            <textarea id="desc" class="input-field" placeholder="Provide some context about this link..."></textarea>
          </div>

        </div>

        <button class="btn btn-primary" id="forgeBtn" style="height:56px; font-size:14px;">
          <i class="fas fa-microchip"></i>
          <span>Forge Secure Link</span>
        </button>

        <div class="result-box" id="resultArea">
          <p class="result-label">📋 Encrypted URL Ready</p>
          <div class="result-url" id="finalLink"></div>
          <button class="btn btn-success" id="copyBtn" style="height:52px;">
            <i class="fas fa-copy"></i>
            <span>Copy Link</span>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <footer class="create-footer">
        <p>&copy; 2026 <a href="https://skytup.com" target="_blank">skytup.com</a> &mdash; All rights reserved.</p>
      </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
      particlesJS("particles-js", {
        particles: {
          number: { value: 55, density: { enable: true, value_area: 800 } },
          color: { value: "#a855f7" },
          opacity: { value: 0.25 },
          size: { value: 3, random: true },
          line_linked: { enable: true, distance: 150, color: "#6366f1", opacity: 0.18, width: 1 },
          move: { enable: true, speed: 1.8 }
        }
      });

      function forge(data) {
        const ts = Date.now().toString();
        const salt = Math.random().toString(36).substring(2, 8);
        let s = JSON.stringify({ ...data, ts, salt });
        let b = btoa(unescape(encodeURIComponent(s)));
        let shifted = b.split('').map(x => String.fromCharCode(x.charCodeAt(0) + 3)).join('');
        let c = "";
        for (let i = 0; i < shifted.length; i++) {
          c += shifted[i];
          if (i % 5 === 0) c += Math.random().toString(36).substring(2, 3);
        }
        return btoa("st_" + btoa(c).replace(/=/g, '') + "_tp").replace(/=/g, '');
      }

      // Returns { id, src } — src is the full clean embed URL to use directly
      function getYTData(input) {
        if (!input) return null;
        input = input.trim();

        // 1. Full <iframe> embed code — extract src attribute
        const srcMatch = input.match(/src=["']([^"']+)["']/);
        if (srcMatch) input = srcMatch[1];

        // 2. Already an embed URL: youtube.com/embed/VIDEO_ID(...params)
        const embedMatch = input.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{11})([^"'\s]*)/);
        if (embedMatch) {
          const id  = embedMatch[1];
          const src = 'https://www.youtube.com/embed/' + id + embedMatch[2];
          return { id, src };
        }

        // 3. Standard watch / short URLs
        const watchMatch = input.match(/(?:youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/);
        if (watchMatch) {
          const id = watchMatch[1];
          return { id, src: 'https://www.youtube.com/embed/' + id };
        }

        // 4. Plain 11-char video ID
        if (/^[A-Za-z0-9_-]{11}$/.test(input)) {
          return { id: input, src: 'https://www.youtube.com/embed/' + input };
        }

        return null;
      }

      document.getElementById('forgeBtn').onclick = () => {
        const title = document.getElementById('title').value.trim();
        const url   = document.getElementById('url').value.trim();
        if (!title || !url) return alert('Title and Destination URL are required.');

        const cover  = document.getElementById('cover').value.trim();
        const logo   = document.getElementById('logo').value.trim();
        const ytData = getYTData(document.getElementById('yt').value.trim());
        const desc   = document.getElementById('desc').value.trim();

        const v    = forge({ title, url, cover, album: logo, yt: ytData ? ytData.id : null, ytSrc: ytData ? ytData.src : null, desc });
        const base = window.location.href.replace(/\/[^/]*$/, '');
        const link = base + '/index.html?v=' + v;

        document.getElementById('finalLink').innerText = link;
        const box = document.getElementById('resultArea');
        box.style.display = 'block';
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };

      document.getElementById('copyBtn').onclick = () => {
        navigator.clipboard.writeText(document.getElementById('finalLink').innerText);
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<i class="fas fa-check"></i> <span>Copied!</span>';
        setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> <span>Copy Link</span>'; }, 2200);
      };
    </script>
  </body>
</html>
