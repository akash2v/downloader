<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Unlock Your Exclusive File!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="blinking-dot"></div>
      <span>Limited Time Download! Act Fast!</span>
    </header>

    <div class="container" id="mainContainer">
      <div class="header">
        <div class="header-icon">
          <i class="fas fa-gift"></i>
        </div>
        <h1>Your EXCLUSIVE File is Almost Ready!</h1>
        <p>Just complete these simple steps to unlock your download!</p>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="instruction-box">
        <p>
          <i class="fas fa-exclamation-triangle"></i> You're so close! Finish the tasks to get your file!
        </p>
      </div>

      <div class="tasks-container" id="tasksContainer"></div>

      <div class="download-section">
        <button class="download-button" id="downloadBtn" disabled>
          <i class="fas fa-lock"></i>
          <span>UNLOCK DOWNLOAD</span>
        </button>
      </div>
    </div>

    <div class="footer">
      <p>
        Copyright &copy; 2026
        <a href="https://skytup.com" target="_blank">skytup.com</a> | Follow on
        <a href="https://github.com/akash2v" target="_blank">Github</a>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
