<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Secure Access | Verification Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y8ZQT3XHMW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-Y8ZQT3XHMW");
    </script>
  </head>
  <body>
    <div class="body-bg" id="bodyBg"></div>
    <div class="body-overlay"></div>
    <div id="particles-js"></div>

    <div class="container" id="mainContainer">

      <!-- LEFT: Branding -->
      <section class="branding-section">
        <div class="logo-box" id="logoArea">
          <i class="fas fa-shield-halved"></i>
        </div>

        <h1 id="fileTitle">Identity Verification</h1>

        <p class="desc-text" id="fileDesc">Complete the steps on the right to unlock your secure download link.</p>

        <!-- YouTube embed or cover image -->
        <div class="media-box" id="mediaBox"></div>
      </section>

      <!-- RIGHT: Actions -->
      <section class="action-section">

        <!-- Progress bar -->
        <div class="progress-container">
          <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
          </div>
        </div>

        <!-- Section heading -->
        <div class="unlock-heading">
          <i class="fas fa-lock-open"></i>
          <span>To unlock your download link, complete these tasks</span>
        </div>

        <!-- Task list -->
        <div class="tasks-container" id="tasksList"></div>

        <!-- Unlock button -->
        <div class="download-wrap">
          <button class="btn btn-primary" id="downloadBtn" disabled>
            <i class="fas fa-lock"></i>
            <span>Unlock Access</span>
          </button>
        </div>

      </section>
    </div>

    <!-- Footer outside container -->
    <footer class="footer">
      <p>&copy; 2026 <a href="https://skytup.com" target="_blank">skytup.com</a> &mdash; All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
